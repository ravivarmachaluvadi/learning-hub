<!doctype html>
<!--
  data-rcv-mounted="true": the "Raw Code Highlight" Chrome extension replaces EVERY page opened from
  disk (file://) with a plain-text code view, HTML pages included, and skips pages already carrying
  this marker. It keeps the tool usable when opened by double-click. Harmless everywhere else.
-->
<html lang="en" data-rcv-mounted="true">

  <script>
    /* Apply a forced light/dark theme before the first paint, so the page never flashes. */
    try { var t = localStorage.getItem('clt.theme'); if (t === '"light"' || t === '"dark"') document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
